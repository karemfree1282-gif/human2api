<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Human2API demonstration invoice form"><title>Acme Invoices - Human2API Sandbox</title><link rel="stylesheet" href="/demo.css"><script src="/demo.js" defer></script></head><body><div class="box"><div class="logo"><strong>ACME<span class="acme-dot">.</span> <b>INVOICES</b></strong><a href="/">Human2API demo ↗</a></div><h1>Create an invoice</h1><p>A local, fake invoice app. No payment, account, network request or personal data storage. Use it to try your first automation.</p><form id="invoice-form"><label for="customer-name">Customer name</label><input id="customer-name" name="customer_name" type="text" required placeholder="Jane Doe" autocomplete="off"><label for="invoice-amount">Amount (USD)</label><input id="invoice-amount" name="amount" type="number" min="0.01" step="0.01" required placeholder="49.99"><button id="make-invoice" type="submit">Create invoice →</button></form><section class="result" id="invoice-result" hidden><strong id="invoice-status">Invoice created successfully</strong><p id="invoice-summary"></p><button id="download-invoice" type="button">Download text invoice ↓</button></section></div></body></html>
