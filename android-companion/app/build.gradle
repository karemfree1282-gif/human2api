plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.human2api.companion'
    compileSdk 34

    defaultConfig {
        applicationId "dev.human2api.companion"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "0.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
