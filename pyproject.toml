[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human2api"
version = "0.5.0"
description = "Record browser, desktop, and Android tasks. Reuse workflows through CLI, REST, MCP, and Visual Studio."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Human2API contributors"}]
keywords = ["automation", "playwright", "selenium", "mcp", "agents", "browser", "desktop", "android", "recording", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = ["cryptography>=41,<51"]

[project.optional-dependencies]
browser = ["playwright>=1.40,<2", "selenium>=4.10,<5"]
dev = ["pytest>=8,<10", "build>=1,<2", "Pillow>=10,<13", "jsonschema>=4,<5", "tomli>=2,<3; python_version < '3.11'"]
desktop = ["pyautogui>=0.9.54,<1", "pynput>=1.7,<2", "opencv-python>=4.9,<5"]
accessibility = ["pywinauto>=0.6.8,<1; sys_platform == 'win32'", "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'"]
studio = ["pywebview>=5,<7"]
vault = ["cryptography>=41,<51"]
signing = ["cryptography>=41,<51"]

[project.scripts]
h2a = "human2api.cli:main"

[project.urls]
Homepage = "https://github.com/karemfree1282-gif/human2api"
Issues = "https://github.com/karemfree1282-gif/human2api/issues"
Documentation = "https://github.com/karemfree1282-gif/human2api#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
human2api = ["static/*", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: requires locally installed Chromium"]
