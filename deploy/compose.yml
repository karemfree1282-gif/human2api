services:
  registry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.registry
    command: ['serve', '--directory', '/data/registry', '--host', '0.0.0.0', '--public-origin', 'https://${H2A_DOMAIN:?Set your owned registry domain}']
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 384m
    volumes: ['registry-data:/data']
    networks: [private]
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      H2A_DOMAIN: '${H2A_DOMAIN:?Set your owned registry domain}'
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private]
    depends_on: [registry]
networks:
  private: {}
volumes:
  registry-data: {}
  caddy-data: {}
  caddy-config: {}
