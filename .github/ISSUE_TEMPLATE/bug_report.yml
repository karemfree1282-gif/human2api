name: Bug report
description: Report a reproducible problem without exposing private data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not paste secrets, live customer data, or sensitive workflows. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11 / Python 3.12 / Chromium 130"
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: text
