name: Android build
on:
  push:
    branches: [main]
  pull_request:
    paths: ['android-companion/**', 'scripts/build_android.py', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify preconfigured runner SDK
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Compile, lint and package companion
        run: python scripts/build_android.py --output android-output
      - uses: actions/upload-artifact@v4
        with:
          name: android-companion-debug
          path: android-output/
          if-no-files-found: error
