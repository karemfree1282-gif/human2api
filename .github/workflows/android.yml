name: Android Companion APK
on:
  push:
    paths:
      - 'android-companion/**'
      - 'scripts/build_android.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-companion/**'
      - 'scripts/build_android.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android 34 SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build actual debug APK
        run: python3 scripts/build_android.py
      - name: Upload actual APK only on success
        uses: actions/upload-artifact@v4
        with:
          name: human2api-companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
