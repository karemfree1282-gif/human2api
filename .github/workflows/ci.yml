name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Python ${{ matrix.python }} - unit and DOM tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/doctor.py && h2a --version && h2a list && h2a check create_invoice && h2a openapi --output /tmp/openapi.json
