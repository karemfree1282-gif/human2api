name: Native builds
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: python -m pip install -e '.[studio,desktop,accessibility,vault,signing]' 'pyinstaller>=6.16,<7'
      - name: Linux Qt backend
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'PySide6>=6.8,<7'
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 python3-pyatspi
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Build current platform and smoke test frozen CLI
        run: python scripts/build_native.py --bundle-browser --output native-output
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            native-output/*.zip
            native-output/*.tar.gz
            native-output/*.dmg
            native-output/*-setup.exe
            native-output/native-build.json
          if-no-files-found: error
