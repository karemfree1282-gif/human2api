name: Release
on:
  push:
    tags: ['v*']
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  native:
    uses: ./.github/workflows/native.yml
  android:
    uses: ./.github/workflows/android.yml
  release:
    needs: [verify, native, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Confirm tag matches package version
        run: |
          python -c "import os, tomllib; assert os.environ['GITHUB_REF_NAME'] == 'v'+tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - run: python -m build
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
      - uses: actions/download-artifact@v4
        with:
          name: android-companion-debug
          path: dist/android
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
          generate_release_notes: true
